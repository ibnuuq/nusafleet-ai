[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nusafleet-ai"
version = "0.1.0"
description = "NusaFleet AI -- multi-agent investigation platform (M1 foundation)"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7",
    "pydantic-settings>=2.2",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
]
data = [
    "pandas",
    "numpy",
    "faker",
    "psycopg2-binary",
]

[tool.setuptools]
packages = { find = { where = ["."], include = ["src*"] } }

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
markers = [
    "live: hits a real external LLM endpoint (OpenRouter/Ollama); auto-skips if unavailable. Deselect with -m \"not live\".",
]
